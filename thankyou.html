<!DOCTYPE html>
<html lang="hi">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Order Confirmed | Mirgi Mukti</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Mukta:wght@400;500;600;700;800&family=Poppins:wght@400;500;600;700;800&display=swap"
    rel="stylesheet">

  <link rel="stylesheet" href="css/style.css?v=thankyou_page_v1">

  <style>
    body {
      background-color: #F2F8FB;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px 16px;
      margin: 0;
      font-family: 'Poppins', 'Mukta', sans-serif;
    }

    .thankyou-standalone-container {
      width: 100%;
      max-width: 420px;
      margin: 0 auto;
    }
  </style>
</head>

<body>

  <div class="thankyou-standalone-container">
    <div class="thankyou-modal-card" style="box-shadow: 0 16px 45px rgba(11, 60, 93, 0.12); border: 2px solid rgba(51, 195, 165, 0.25);">

      <!-- Close Button / Home Link -->
      <a href="index.html" class="modal-close-btn" aria-label="Home">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5"
          stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </a>

      <!-- Success Checkmark Circle with concentric rings -->
      <div class="thankyou-check-outer">
        <div class="thankyou-check-inner">
          <svg viewBox="0 0 24 24" width="32" height="32" fill="none" stroke="#33C3A5" stroke-width="3"
            stroke-linecap="round" stroke-linejoin="round">
            <polyline points="20 6 9 17 4 12"></polyline>
          </svg>
        </div>
      </div>

      <!-- Pill Tag -->
      <div class="thankyou-pill-tag">
        <span>Order Confirmed!</span>
      </div>

      <!-- Greeting & Product Line -->
      <h3 class="thankyou-greet-title">बधाई हो, <span class="thankyou-user-name" id="pageUserName">ग्राहक</span>!</h3>
      <p class="thankyou-greet-sub">
        आपके लिए <strong>Mirgi Mukti</strong> का ऑर्डर सफलतापूर्वक स्वीकार कर लिया गया है।
      </p>

      <!-- Order Details Summary Box -->
      <div class="thankyou-details-box">
        <div class="detail-row">
          <span class="detail-label">Order ID:</span>
          <strong class="detail-value order-id-val" id="pageOrderId">MM-758921</strong>
        </div>
        <div class="detail-divider"></div>
        <div class="detail-row">
          <span class="detail-label">Mobile:</span>
          <strong class="detail-value phone-val" id="pageUserPhone">+91 9675658678</strong>
        </div>
        <div class="detail-divider"></div>
        <div class="detail-row">
          <span class="detail-label">Delivery:</span>
          <strong class="detail-value delivery-val">FREE Express Delivery</strong>
        </div>
      </div>

      <!-- Expert Callout Note -->
      <p class="thankyou-callout-note">
        हमारे विशेषज्ञ जल्द ही डिलीवरी कन्फर्मेशन के लिए आपसे संपर्क करेंगे।
      </p>

      <!-- Action Button -->
      <a href="index.html" class="thankyou-confirm-btn" style="text-decoration: none;">
        <span>धन्यवाद, ठीक है</span>
      </a>

    </div>
  </div>

  <script>
    // Read URL parameters or SessionStorage
    document.addEventListener('DOMContentLoaded', () => {
      const urlParams = new URLSearchParams(window.location.search);
      const name = urlParams.get('name') || sessionStorage.getItem('orderName') || 'ग्राहक';
      const phone = urlParams.get('phone') || sessionStorage.getItem('orderPhone') || '9876543210';
      const orderId = urlParams.get('order_id') || sessionStorage.getItem('orderId') || ('MM-' + Math.floor(100000 + Math.random() * 900000));

      document.getElementById('pageUserName').textContent = name;
      document.getElementById('pageUserPhone').textContent = '+91 ' + phone;
      document.getElementById('pageOrderId').textContent = orderId;
    });
  </script>

</body>

</html>
